apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.app.name }}-route
spec:
  parentRefs:
    - name: {{ .Values.app.name }}-gateway
  hostnames:
    {{- toYaml .Values.gateway.hosts | nindent 4 }}
  rules:
    {{- range .Values.gateway.routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      backendRefs:
        - name: {{ $.Values.app.name }}-{{ .service }}
          port: {{ (index $.Values .service).port }}
    {{- end }}