apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-backend
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: {{ .Values.backend.component }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}