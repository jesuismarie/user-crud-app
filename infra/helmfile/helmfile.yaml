environments:
  dev:
    values:
      - environments/dev.yaml.gotmpl
---
repositories:
  - name: eks
    url: https://aws.github.io/eks-charts
  - name: aws-ebs-csi-driver
    url: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: jetstack
    url: https://charts.jetstack.io
  - name: gateway-nginx
    url: ghcr.io/nginx/charts
    oci: true
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: "3.14.0"
    values:
      - values/metrics-server.yaml

  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    wait: true
    version: "v1.21.2"
    needs:
      - nginx-gateway/nginx-gateway-fabric
    values:
      - values/cert-manager.yaml

  - name: nginx-gateway-fabric
    namespace: nginx-gateway
    createNamespace: true
    chart: gateway-nginx/nginx-gateway-fabric
    wait: true
    version: "2.7.2"
    needs:
      - kube-system/aws-load-balancer-controller
    values:
      - values/nginx-gateway-fabric.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: kubectl
        args:
          - apply
          - --server-side
          - -f
          - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/standard-install.yaml

  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks/aws-load-balancer-controller
    wait: true
    version: "1.17.1"
    values:
      - values/aws-load-balancer-controller.yaml.gotmpl

  - name: aws-ebs-csi-driver
    namespace: kube-system
    chart: aws-ebs-csi-driver/aws-ebs-csi-driver
    version: "2.66.0"
    values:
      - values/aws-ebs-csi-driver.yaml.gotmpl

  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: "10.9.5"
    values:
      - values/argocd.yaml
