name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
  pull_request:
    paths:
      - "app/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt

      - name: Install dependencies
        working-directory: app/backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: app/backend
        run: pytest

      - name: Check dependencies for known vulnerabilities
        working-directory: app/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build-and-push:
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_repository: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Make the image tag from the commit
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-live-env:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: update-live-env
      cancel-in-progress: false
    env:
      IMAGE_REPOSITORY: ${{ needs.build-and-push.outputs.image_repository }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Check out live-environments
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIVE_ENV_REPOSITORY }}
          ssh-key: ${{ secrets.LIVE_ENV_DEPLOY_KEY }}
          path: live-environments

      - name: Write the new image into the values file
        working-directory: live-environments
        run: |
          yq -i '.appImage.repository = strenv(IMAGE_REPOSITORY) | .appImage.tag = strenv(IMAGE_TAG)' \
            aws/dev/user-crud-app/values.yaml

      - name: Commit and push
        working-directory: live-environments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws/dev/user-crud-app/values.yaml
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "chore: deploy user-crud-app ${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main